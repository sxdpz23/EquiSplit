name: equisplit
description: "Effortlessly split expenses and manage shared finances on the go! Whether it's splitting bills with friends, managing household expenses, or organizing group finances, EquiSplit has you covered. Create groups, add members, and track shared expenses with ease. Stay on top of your finances and enjoy hassle-free money management with EquiSplit!"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_vector_icons: ^2.0.0    #helps to get more options for icons
  image_picker: ^0.8.7+6      #helps to pick image from gallery
  qr_flutter: ^4.1.0        #helps to generate qr code
  mobile_scanner: ^6.0.2      #helps to scan a qr code and get its data
  shape_of_view_null_safe: ^3.0.0       #helps in creating a custom shape
  modal_bottom_sheet: ^3.0.0        #for a modal bottom sheet
  flex_dropdown: ^0.2.0       #for custom dropdown
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
